<div class="pagination">
    <div>
        Items per page
        <!-- select how many items should be displayed per page ('all' = 0: disregard pagination) -->
        <select ng-model="selectedSize"
                ng-options="size.value as size.label for size in pageSizes"
                ng-change="changePageSize(selectedSize)"></select>
    </div>
    <div>
        <button ng-click="goTo(1)" ng-disabled="page <= 1">&lt;&lt;</button> <!-- 'go to first page' button -->
        <button ng-click="goTo(page - 1)" ng-disabled="page <= 1">&lt;</button> <!-- 'go to previous page' button: can't go lower than 1 -->

        Page <input type="number" min="1"
                    ng-model="inputPage"
                    ng-model-options="{ debounce: 400 }"
                    ng-change="goTo(inputPage)" /> <!-- input to select page to go to: go to page when input changes value -->
        of {{totalPages}} <!-- number of pages -->

        <button ng-click="goTo(page + 1)" ng-disabled="page >= totalPages">&gt;</button> <!-- 'go to next page' button: can't go higher than last page number -->
        <button ng-click="goTo(totalPages)" ng-disabled="page >= totalPages">&gt;&gt;</button> <!-- 'go to last page' button -->
    </div>
    <div>
        <span>{{totalItems}} items</span> <!-- total number of items -->
    </div>

</div>
